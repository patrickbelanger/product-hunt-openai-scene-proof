spring:
  datasource:
    url: ${BROWSER_DATABASE_URL:jdbc:postgresql://localhost:55432/sceneproof?currentSchema=sceneproof_browser}
  flyway:
    default-schema: sceneproof_browser
    schemas: sceneproof_browser
  jpa:
    properties:
      hibernate:
        default_schema: sceneproof_browser

sceneproof:
  http:
    reads-per-minute: 10000
    writes-per-minute: 10000
    media-per-minute: 10000
  paid-runs:
    hourly-limit: 10000
    daily-limit: 10000
  astra:
    api-key: ""
  media:
    root: ${BROWSER_MEDIA_ROOT:.local/browser-media}
